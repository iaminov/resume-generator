name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor claimed in the README; 3.13 is what development
        # happens on. Running both keeps that claim honest.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check tools/ tests/

      - name: Run tests
        run: pytest

      # LibreOffice is absent on the runner, so this also exercises the
      # fallback path where page verification is unavailable and the tools
      # must degrade to the estimator rather than fail.
      - name: Smoke-test the generators without a renderer
        run: |
          python tools/generate_resume.py tests/fixtures/sample_resume.json /tmp/out.docx
          python tools/generate_cover_letter.py tests/fixtures/sample_letter.json /tmp/out_letter.docx

      - name: Validate the example schemas
        run: python tools/validate.py --schema job-description tests/fixtures/sample_job_description.json
